[project]
name = "langgraph-agent-evals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-ollama==1.1.0",
    "langgraph==1.2.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "agentevals==0.0.9",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["ollama: needs a local Ollama server with the pinned models"]
